name: "Run Unit Tests"

on:

  workflow_dispatch: # enable manual trigger

  schedule:
    - cron: "0 4 * * *"

  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:

    # WILLOWMAKER is released for Windows, Linux, and macOS, and the CDN tests resolve a different client distribution variant on each operating system, so the suite runs on all three
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]

    runs-on: ${{ matrix.os }}

    steps: # latest action versions can be inspected at https://github.com/actions

    - name: "Check Out Branch"
      uses: "actions/checkout@v7"

    - name: "Install .NET 11"
      uses: "actions/setup-dotnet@v6"
      with:
        dotnet-version: "11.x"
        dotnet-quality: "preview"

    - name: "Print .NET Version"
      run: "dotnet --version"

    - name: "Restore Dependencies"
      run: "dotnet restore source/WILLOWMAKER.slnx"

    - name: "Build Solution"
      run: "dotnet build source/WILLOWMAKER.slnx --no-restore"

    - name: "Run Tests"
      run: "dotnet test --solution source/WILLOWMAKER.slnx --no-build --verbosity normal -- --report-trx --results-directory test-results"

    - name: "Publish Test Results"
      if: always()
      uses: "actions/upload-artifact@v7"
      with:
        name: "Published Test Results (${{ matrix.os }})"
        path: "test-results"
        compression-level: "0"
        if-no-files-found: "error"
        retention-days: "28"
